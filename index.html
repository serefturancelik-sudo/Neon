<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Savaşları - Gelişmiş</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { user-select: none; touch-action: none; overflow: hidden; background-color: #0d0e15; color: white; }
        .touch-btn { touch-action: manipulation; }
    </style>
</head>
<body class="w-screen h-screen flex flex-col">

    <div id="menu" class="absolute inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center p-6 text-center">
        <h1 class="text-4xl font-bold mb-8 text-cyan-400">NEON SAVAŞLARI</h1>
        <div class="flex gap-4">
            <button onclick="startGame(false)" class="p-6 bg-cyan-900 rounded-xl border border-cyan-500">İNSAN VS İNSAN</button>
            <button onclick="startGame(true)" class="p-6 bg-red-900 rounded-xl border border-red-500">İNSAN VS BOT</button>
        </div>
    </div>

    <canvas id="gameCanvas" class="flex-grow"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let isBotMode = false;
        let gameRunning = false;
        let p1, p2, bullets = [], bombs = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.onresize = resize;
        resize();

        class Entity {
            constructor(x, y, color) { this.x = x; this.y = y; this.color = color; this.radius = 15; }
        }

        function startGame(botMode) {
            isBotMode = botMode;
            document.getElementById('menu').classList.add('hidden');
            // Rastgele başlangıç pozisyonları
            p1 = { ...new Entity(50, 50, 'cyan'), angle: 0, hp: 3 };
            p2 = { ...new Entity(canvas.width - 50, canvas.height - 50, 'red'), angle: Math.PI, hp: 3 };
            gameRunning = true;
            requestAnimationFrame(loop);
        }

        function loop() {
            if (!gameRunning) return;
            ctx.fillStyle = 'rgba(13, 14, 21, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Bomba üretimi
            if (Math.random() < 0.01 && bombs.length < 3) {
                bombs.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height });
            }

            // Bombaları çiz
            ctx.fillStyle = 'red';
            bombs.forEach(b => ctx.fillRect(b.x, b.y, 20, 20));

            // Bot Mantığı
            if (isBotMode) {
                const dx = p1.x - p2.x;
                const dy = p1.y - p2.y;
                p2.angle = Math.atan2(dy, dx);
                p2.x += Math.cos(p2.angle) * 1.5;
                p2.y += Math.sin(p2.angle) * 1.5;
            }

            // Gemileri çiz
            drawShip(p1);
            drawShip(p2);

            requestAnimationFrame(loop);
        }

        function drawShip(s) {
            ctx.save();
            ctx.translate(s.x, s.y);
            ctx.rotate(s.angle);
            ctx.fillStyle = s.color;
            ctx.beginPath();
            ctx.moveTo(20, 0); ctx.lineTo(-10, -10); ctx.lineTo(-10, 10);
            ctx.fill();
            ctx.restore();
        }
    </script>
</body>
</html>
