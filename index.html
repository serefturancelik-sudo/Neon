<div id="lobby-screen" class="absolute inset-0 bg-slate-950 z-[100] flex flex-col items-center justify-center p-6 text-center">
    <h1 class="text-4xl font-extrabold mb-8 text-cyan-400">NEON ARENA</h1>
    <div class="w-full max-w-sm space-y-4">
        <button onclick="initLobby('bot')" class="w-full py-4 bg-red-600 rounded-xl font-bold border border-red-500 shadow-lg">BOT'A KARŞI OYNA</button>
        <button onclick="initLobby('pvp')" class="w-full py-4 bg-cyan-600 rounded-xl font-bold border border-cyan-500 shadow-lg">2 KİŞİLİK (TAKIM)</button>
        <button onclick="alert('Odadan ayrıldın, sayfayı yenile!')" class="w-full py-2 bg-slate-800 text-slate-400 rounded-lg text-xs">ODADAN AYRIL</button>
    </div>
</div>

<script>
    let isBotMode = false;

    function initLobby(mode) {
        isBotMode = (mode === 'bot');
        document.getElementById('lobby-screen').classList.add('hidden');
        startGame(); // Mevcut oyununu başlatır
    }

    // Oyun döngüsü içine Bot mantığını ekleyelim
    function updateBot() {
        if (!isBotMode || !gameRunning) return;
        
        // Basit Bot: Kırmızı gemi (p2) Mavi gemiyi (p1) takip eder
        const dx = p1.x - p2.x;
        const dy = p1.y - p2.y;
        const targetAngle = Math.atan2(dy, dx);
        
        // Açıyı yakala
        if (Math.abs(p2.angle - targetAngle) > 0.1) {
            p2.angle += (p2.angle < targetAngle) ? 0.05 : -0.05;
        }
        
        // Harekete geç
        p2.vx += Math.cos(p2.angle) * 0.1;
        p2.vy += Math.sin(p2.angle) * 0.1;
        
        // Rastgele ateş et
        if (Math.random() < 0.03) fireBullet(p2);
    }

    // gameLoop fonksiyonunun içine şunu ekle:
    // updateBot(); // <-- Buraya yaz
</script>
